<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="hsl(220 12% 21%)" stroke-width="1" opacity="0.55"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="hsl(222 18% 9%)" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="hsl(222 18% 9%)" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="hsl(222 18% 9%)" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="hsl(222 18% 9%)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#fade)"/>

  <rect x="0" y="0" width="1200" height="6" fill="hsl(18 76% 58%)"/>

  <g font-family="Alef">
    <text x="90" y="228" font-size="26" font-weight="700" letter-spacing="4.5"
          fill="hsl(18 76% 58%)">SYSTEMS ENGINEER</text>

    <text x="86" y="342" font-size="104" font-weight="700" letter-spacing="-2"
          fill="hsl(40 18% 92%)">Thomas Jensen</text>

    <text x="90" y="404" font-size="31" font-weight="400"
          fill="hsl(218 10% 72%)">Rust · native software · backend infrastructure</text>

    <line x1="90" y1="470" x2="330" y2="470" stroke="hsl(220 12% 21%)" stroke-width="2"/>

    <text x="90" y="524" font-size="27" font-weight="700" letter-spacing="1"
          fill="hsl(40 18% 92%)">thojensen.com</text>
  </g>
