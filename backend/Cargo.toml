[package]
name = "portfolio-backend"
version = "0.1.0"
edition = "2024"

[build-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ts-rs = "10.0.1"

[dependencies]
anyhow = "1.0.102"
aws-config = { version = "1.0.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.4.0", features = ["rt-tokio"] }
axum = "0.8.9"
axum-core = "=0.5.6"
axum-prometheus = "0.10.0"
derivative = "2.2.0"
dotenvy = "0.15"
futures = "0.3.32"
http = "=1.4.0"
hyper = { version = "1.0", features = ["server"] }
regex = "1.12.3"
resend-rs = "0.24.0"
serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
tokio = { version = "1.51.1", features = ["full"] }
tokio-util = "0.7.19"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-full", "set-header", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "0.3.19", features=["env-filter", "json"] }
ts-rs = "10.0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
qubit = "0.10.3"
